# Full local stack: `cp .env.example .env && docker compose up --build`
# Public entry points: frontend http://localhost:3000, API gateway http://localhost:8080

x-service: &service
  build: &service-build
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: info
    NATS_URL: nats://nats:4222
    CATALOG_URL: http://catalog:4101
    PAYMENTS_URL: http://payments:4103
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: px
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-px}
      POSTGRES_DB: px
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U px"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    ports: ["4222:4222", "8222:8222"]

  catalog:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: catalog } }
    environment: { <<: *service-env, PORT: 4101 }

  projects:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: projects } }
    environment:
      <<: *service-env
      PORT: 4102
      DATABASE_URL: postgres://px:${POSTGRES_PASSWORD:-px}@postgres:5432/px_projects
      PRODUCT_URLS: ${PRODUCT_URLS:-}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      catalog: { condition: service_healthy }

  payments:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: payments } }
    environment:
      <<: *service-env
      PORT: 4103
      DATABASE_URL: postgres://px:${POSTGRES_PASSWORD:-px}@postgres:5432/px_payments
      PAYMENT_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

  media:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: media } }
    environment: { <<: *service-env, PORT: 4104, STORAGE_DIR: /data/uploads, PUBLIC_PATH: /api/media }
    volumes: [media-data:/data]

  ai:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: ai } }
    environment:
      <<: *service-env
      PORT: 4105
      AI_GENERATOR: ${AI_GENERATOR:-template}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    depends_on:
      nats: { condition: service_started }
      catalog: { condition: service_healthy }

  sales:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: sales } }
    environment:
      <<: *service-env
      PORT: 4106
      DATABASE_URL: postgres://px:${POSTGRES_PASSWORD:-px}@postgres:5432/px_sales
      PROJECTS_URL: http://projects:4102
      PRODUCT_URLS: ${PRODUCT_URLS:-}
      # WhatsApp and the AI seller are off locally unless configured.
      GOWA_API_URL: ${GOWA_API_URL:-}
      ANTHROPIC_API_KEY: ${SALES_ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      projects: { condition: service_healthy }

  gateway:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: gateway } }
    environment:
      <<: *service-env
      PORT: 8080
      PROJECTS_URL: http://projects:4102
      MEDIA_URL: http://media:4104
      SALES_URL: http://sales:4106
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      # The frontend proxies browser calls and forwards the client IP.
      TRUST_PROXY: "true"
    ports: ["8080:8080"]
    depends_on: [catalog, projects, payments, media, sales]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    restart: unless-stopped
    environment:
      API_URL: http://gateway:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BRAND_DOMAINS: ${BRAND_DOMAINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_USER: ${ADMIN_USER:-studio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports: ["3000:3000"]
    depends_on: [gateway]

volumes:
  postgres-data:
  nats-data:
  media-data:
