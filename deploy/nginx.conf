# /etc/nginx/sites-available/px — Project X on the shared server (next to MyBooks and DoseWear).
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/px && sudo ln -s ../sites-available/px /etc/nginx/sites-enabled/px
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx --cert-name px -d px.185.102.75.191.sslip.io -d coverme.185.102.75.191.sslip.io \
#            -d shezhire.185.102.75.191.sslip.io -d mygame.185.102.75.191.sslip.io
# Hub + studio admin on px.*, each brand on its own host (BRAND_DOMAINS in ~/px/.env). Everything goes to the
# Next.js frontend on [::1]:3070; the gateway and services listen on 127.0.0.1 only and are never exposed.

# Per-client limits in front of the app (the gateway has its own per-IP limit as a second line).
limit_req_zone $binary_remote_addr zone=px_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=px_upload:10m rate=2r/s;

upstream px_frontend {
    server [::1]:3070 max_fails=0;  # Next with HOSTNAME=localhost listens on ::1 only
    keepalive 16;
}

server {
    listen 80;
    server_name px.185.102.75.191.sslip.io coverme.185.102.75.191.sslip.io
                shezhire.185.102.75.191.sslip.io mygame.185.102.75.191.sslip.io;

    # Photos up to 15 MB (MAX_UPLOAD_BYTES) plus multipart overhead.
    client_max_body_size 20m;

    # The client IP is taken from the TCP connection only: a forged X-Forwarded-For from the browser is dropped,
    # so the gateway (TRUST_PROXY) rate-limits the real visitor.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/media/uploads {
        limit_req zone=px_upload burst=10 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://px_frontend;
    }

    location /api/ {
        limit_req zone=px_api burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;
        proxy_pass http://px_frontend;
    }

    location /_next/static/ {
        proxy_pass http://px_frontend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_read_timeout 60s;
        proxy_pass http://px_frontend;
    }
}
